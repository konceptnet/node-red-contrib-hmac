name: publish

# Publie sur npm via Trusted Publishing (OIDC) quand un tag vX.Y.Z est poussé.
# Aucun token npm requis — l'identité est prouvée par GitHub Actions (id-token).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write        # requis pour le Trusted Publishing OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      # npm récent requis pour l'OIDC Trusted Publishing + provenance
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
